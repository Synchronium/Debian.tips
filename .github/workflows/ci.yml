name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `npm run check` sets NODE_ENV=production itself, so this is the same gate that runs
      # locally. It used to be set here only, which meant drafts were included locally and
      # excluded in CI, and the link audit, the linkcheck and the about page's figures could
      # all differ between a clean local run and a red one here.
      - run: npm run check
      - name: Serve dist/ for pa11y-ci
        run: npx serve -l 4321 dist &
      - name: Wait for local server
        run: npx wait-on http://localhost:4321
      # The URL list is generated from the sitemap the build just wrote, so a new category or
      # page shape is covered the day it exists rather than when someone remembers to add it.
      - name: Choose the pages to check
        run: npx tsx scripts/pa11y-urls.ts
      - run: npx pa11y-ci

  # Runs every documented `output:` block on every command page for real, inside a
  # disposable Debian container, and diffs the result against what the page claims. The
  # `check` job above validates shape (schema, links, types) and would pass a page whose
  # examples print something no command ever produced. This is the job that tests the
  # site's actual promise, and it's separate because it needs Docker and its own image.
  #
  # A separate job rather than a step in `check` so the two run in parallel and a failure
  # says which kind it is: "the generator is broken" and "a page is lying" want different
  # people looking at them.
  replay:
    runs-on: ubuntu-latest
    # Seven shards, each on its own runner. Serial the site is 427 seconds; split seven ways the
    # slowest shard is 63 (measured 2026-08-26). The floor is one page, because a page is never
    # split: `apt` alone is 63 seconds, so no number of shards beats that.
    #
    # Seven is where the curve stops moving. Five comes out at 86 and six at 71, so the sixth and
    # seventh runners buy 15 and 8 seconds; the eighth buys nothing at all, and every count above
    # it stays on the floor. Buying those seconds is worth a runner because **deploy waits on
    # this**: `deploy.yml` triggers on this workflow's conclusion, so the slowest shard is time
    # between a push and the site being live, not just a number in a log.
    #
    # Re-measure before changing it, because the whole curve moves as pages are added. Once the
    # count is on the floor, more runners do nothing and the lever is the `apt` page's setup
    # script instead. ADR-0020's "Revisit when" holds that.
    #
    # Each shard is its own runner, so this is not the CPU contention that has produced false
    # failures here before (.claude/skills/ship/SKILL.md): that is about two heavy jobs sharing
    # one machine, which nothing here does.
    #
    # Which pages a shard takes is decided by scripts/lib/replayShard.ts, balanced from recorded
    # timings. Deploy keys off the whole workflow's conclusion, so every shard has to pass.
    #
    # The shard list below is the only place this workflow writes the count; the expressions read
    # it back as `strategy.job-total`, so changing the split is editing one line here. The prose
    # above and in docs/adr/0003 still names the number, because it is reasoning about the choice
    # rather than repeating a constant, and a different number wants different reasoning.
    #
    # That one-line property holds only while `shard` is the sole matrix dimension and nothing is
    # added by `include`. `job-total` counts jobs rather than shard values, so a second dimension
    # would push it past the last shard, and the run would replay a fraction of the pages while
    # reporting success.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    name: replay (${{ matrix.shard }}/${{ strategy.job-total }})
    # The budget is for building the sandbox image on a cold runner, plus room for a hung example
    # that somehow escapes the per-example timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # `--changed` diffs this branch against its base, which needs more than the shallow
          # clone actions/checkout takes by default.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Only the yaml parser is needed, but `npm ci` is what the lockfile guarantees.
      - run: npm ci
      # Built here rather than inside the first `sandbox.sh start` so the log shows image
      # build time and replay time separately, so if this job ever gets slow, that says
      # which half to fix. Caching the image (docker buildx + actions/cache) is the next
      # lever if the build dominates; it isn't worth the failure modes until it does.
      - name: Build the sandbox image
        run: scripts/sandbox.sh build
      # A pull request replays the pages its diff touches, and everything if it touched the
      # harness, where one change can move any page's output. A push to main always replays the
      # whole site, so nothing is deployed on the strength of a partial run.
      #
      # The pull-request run is sharded too. Most diffs give it fewer pages than there are
      # shards, so most of these jobs report an empty shard and exit 0, which costs a runner
      # doing nothing and keeps one code path rather than two.
      #
      # There is no second, differently-ordered job beside these any more. Under ADR-0020 every
      # page gets its own container, so the order pages run in cannot reach any result, and a
      # job that varied it would be a gate that can never fail.
      - name: Replay the changed pages
        if: github.event_name == 'pull_request'
        run: npm run replay -- --changed --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          REPLAY_DIFF_BASE: origin/${{ github.base_ref }}
      - name: Replay every page
        if: github.event_name != 'pull_request'
        run: npm run replay -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
