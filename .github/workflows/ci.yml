name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `npm run check` sets NODE_ENV=production itself, so this is the same gate that runs
      # locally. It used to be set here only, which meant drafts were included locally and
      # excluded in CI, and the link audit, the linkcheck and the about page's figures could
      # all differ between a clean local run and a red one here.
      - run: npm run check
      - name: Serve dist/ for pa11y-ci
        run: npx serve -l 4321 dist &
      - name: Wait for local server
        run: npx wait-on http://localhost:4321
      # `npm run a11y` generates the URL list from the sitemap the build just wrote and then
      # checks it. One command rather than two steps, because pa11y-ci exits 0 on an empty list,
      # so a run that skipped the generate step would report a pass having checked nothing.
      - name: Accessibility
        run: npm run a11y
      # The two things a build cannot establish about itself: that search works, which runs
      # entirely in the browser against Pagefind's WASM and so is loaded by nothing in `check`,
      # and that no page scrolls sideways at 320px. Both assert properties rather than compare
      # against stored output, which is ADR-0022. Same served build as the step above; its own
      # step so a failure says which of the two gates found something.
      - name: Browser checks
        run: npm run browser

  # Runs every documented `output:` block on every command page for real, inside a
  # disposable Debian container, and diffs the result against what the page claims. The
  # `check` job above validates shape (schema, links, types) and would pass a page whose
  # examples print something no command ever produced. This is the job that tests the
  # site's actual promise, and it's separate because it needs Docker and its own image.
  #
  # A separate job rather than a step in `check` so the two run in parallel and a failure
  # says which kind it is: "the generator is broken" and "a page is lying" want different
  # people looking at them.
  replay:
    runs-on: ubuntu-latest
    # Each shard on its own runner. There is a floor no count can beat, because a page is never
    # split across shards: the slowest shard can never be quicker than the slowest page.
    #
    # Worth spending runners to approach that floor, because **deploy waits on this**:
    # `deploy.yml` triggers on this workflow's conclusion, so the slowest shard is time between a
    # push and the site being live rather than a number in a log. Worth stopping once another
    # runner buys seconds, which is the trade `test/replayShard.test.ts` holds this count to. That
    # test computes the curve from the recorded timings and fails on either side of the right
    # answer, printing what the count should be. Nothing here restates its figures: the curve
    # moves as pages are added, and a measurement written into this comment would go stale between
    # one page and the next with nothing to catch it.
    #
    # A runner each is also why this is not the CPU contention that has produced false failures
    # here before (.claude/skills/ship/SKILL.md): that is about two heavy jobs sharing one machine,
    # which nothing here does.
    #
    # Which pages a shard takes is decided by scripts/lib/replayShard.ts, balanced from recorded
    # timings. Deploy keys off the whole workflow's conclusion, so every shard has to pass.
    #
    # The shard list below is the only place the count is written. The expressions read it back as
    # `strategy.job-total` and the test reads it from this file, so changing the split is editing
    # one line here and running the tests to hear whether the new number is defensible.
    #
    # That one-line property holds only while `shard` is the sole matrix dimension and nothing is
    # added by `include`. `job-total` counts jobs rather than shard values, so a second dimension
    # would push it past the last shard, and the run would replay a fraction of the pages while
    # reporting success.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    name: replay (${{ matrix.shard }}/${{ strategy.job-total }})
    # The budget is for building the sandbox image on a cold runner, plus room for a hung example
    # that somehow escapes the per-example timeout.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # `--changed` diffs this branch against its base, which needs more than the shallow
          # clone actions/checkout takes by default.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Only the yaml parser is needed, but `npm ci` is what the lockfile guarantees.
      - run: npm ci
      # Built here rather than inside the first `sandbox.sh start` so the log shows image
      # build time and replay time separately, so if this job ever gets slow, that says
      # which half to fix. Caching the image (docker buildx + actions/cache) is the next
      # lever if the build dominates; it isn't worth the failure modes until it does.
      - name: Build the sandbox image
        run: scripts/sandbox.sh build
      # A pull request replays the pages its diff touches, and everything if it touched the
      # harness, where one change can move any page's output. A push to main always replays the
      # whole site, so nothing is deployed on the strength of a partial run.
      #
      # The pull-request run is sharded too. Most diffs give it fewer pages than there are
      # shards, so most of these jobs report an empty shard and exit 0, which costs a runner
      # doing nothing and keeps one code path rather than two.
      #
      # There is no second, differently-ordered job beside these any more. Under ADR-0020 every
      # page gets its own container, so the order pages run in cannot reach any result, and a
      # job that varied it would be a gate that can never fail.
      - name: Replay the changed pages
        if: github.event_name == 'pull_request'
        run: npm run replay -- --changed --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          REPLAY_DIFF_BASE: origin/${{ github.base_ref }}
      # `--timings-out` on the full run only. A shard writes what it measured and nothing else:
      # the file every shard reads is written once, by `record-timings` below, from all the parts
      # together. A pull request measures a fraction of a fraction and records nothing.
      - name: Replay every page
        if: github.event_name != 'pull_request'
        run: npm run replay -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --timings-out=shard-timings.json
      - name: Keep what this shard measured
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: replay-timings-${{ matrix.shard }}
          path: shard-timings.json
          retention-days: 1

  # Records how long each page took, from the run that just happened.
  #
  # The measurements are a by-product of a job CI already runs: a push to main replays every page,
  # so the whole site is timed on every push and was, until this job existed, thrown away with the
  # runners. Nothing extra is replayed to produce this.
  #
  # Measured on the machines the figures are for. They balance amd64 runners, and were previously
  # taken from whatever architecture happened to run the recording by hand.
  #
  # It commits to main. That is deliberate and ADR-0023 is the record of why, including why the
  # commit does not start CI again.
  record-timings:
    needs: replay
    # `success()` is spelled out because writing any `if` at all replaces the implicit one that a
    # `needs:` job gets. Without it this would run after a red replay and record the timings of a
    # run whose pages do not agree with the site.
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      # `ref` is the branch, not the pushed commit. A push event otherwise checks out a detached
      # HEAD, which has no upstream to push back to. Taking the tip of main also means the merge
      # below sees whatever page set main now has, so a page added while the replay ran shows up
      # as a hole and stops the write instead of being recorded with a time nothing measured.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: replay-timings-*
          path: shard-timings
      # Refuses to write unless the parts cover every page that opts into the replay, so a shard
      # that vanished leaves the previous figures in place instead of a file with holes in it. It
      # also writes nothing when the change is too small to be worth a commit. Both decisions
      # therefore show up as whether the file moved, and the step below has no output to parse.
      - name: Merge the shards' measurements
        run: npx tsx scripts/merge-timings.ts shard-timings
      - name: Commit them
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/replay-timings.json; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/replay-timings.json
          # What prevents the loop is the token: a push made with the default GITHUB_TOKEN starts
          # no workflow run. `[skip ci]` is belt and braces, and keeps that true on the day
          # someone swaps the token for one that does.
          git commit -m "Record replay timings from ${GITHUB_SHA:0:7} [skip ci]"
          # Someone pushing while the replay ran makes this a non-fast-forward, and that is fine:
          # the next push measures the site again and records it. Retrying, or rebasing, would be
          # a job that fights for main to deliver a figure that is advisory either way.
          git push || echo "main moved while this ran; leaving it to the next push."
