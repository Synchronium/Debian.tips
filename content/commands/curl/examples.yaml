command: curl
fixtures:
  - name: "the local test server"
    note: "start it with `python3 http-mock.py` before running the examples - the script is in the site repo at `scripts/fixtures/http-mock.py`"
    from: "curl -s http://127.0.0.1:8080/"
    content: |
      Local test server for the curl and wget pages.

      GET  /get                     echo the query string and request headers
      POST /post                    echo the body, as form fields or JSON
      PUT  /put                     echo the body
      DELETE /delete                echo the request
      GET  /headers                 echo the request headers only
      GET  /user-agent              echo the User-Agent header only
      GET  /basic-auth/user/pass    401 until the right credentials arrive
      GET  /cookies/set/NAME/VALUE  set a cookie, then redirect to /cookies
      GET  /cookies                 echo the cookies the request carried
      GET  /redirect/N              redirect N times, then land on /get
      GET  /status/CODE             answer with that status code
      GET  /delay/SECONDS           wait, then answer
      GET  /robots.txt              a small static file
      GET  /page.html               a small static HTML page
      GET  /site/index.html         a small linked site, for recursive download
      GET  /top.html                one level above /site/, for --no-parent
      GET  /large.bin               64KB, supports Range so a download can be resumed

      Run a second copy with --tls to serve all of the above over HTTPS, with a self-signed
      certificate that nothing trusts.
sections:
  - title: "Basic requests"
    intro: "GET is the default. This section covers what curl shows you by default and how to see more."
    examples:
      - title: "Fetch a URL and print the body"
        code: curl http://127.0.0.1:8080/page.html
        description: "With no flags, curl sends a GET request and prints the response body to stdout."
        output: |2
          <!doctype html>
          <title>Test page</title>
          <h1>Test page</h1>
          <p>A small static page served by the local test server.</p>
        level: basic
        tags: [beginner]
      - title: "Fetch only the response headers"
        code: curl -I http://127.0.0.1:8080/page.html
        description: "`-I` (`--head`) sends a HEAD request, same as GET but the server doesn't send a body, so you get headers only, fast."
        output: |2
          HTTP/1.0 200 OK
          Server: mockhttp/1.0
          Date: Sun, 05 Jul 2026 15:40:00 GMT
          Content-Type: text/html
          Content-Length: 120
        level: basic
      - title: "Print response headers AND body"
        code: curl -i http://127.0.0.1:8080/get
        description: "`-i` (`--include`) keeps the GET request but includes the response headers above the body in the output."
        output: |2
          HTTP/1.0 200 OK
          Server: mockhttp/1.0
          Date: Sun, 05 Jul 2026 15:40:00 GMT
          Content-Type: application/json
          Content-Length: 158

          {
            "args": {},
            "headers": {
              "Accept": "*/*",
              "Host": "127.0.0.1:8080",
              "User-Agent": "curl/8.14.1"
            },
            "url": "http://127.0.0.1:8080/get"
          }
        level: basic
      - title: "Silence the progress meter"
        code: curl -s http://127.0.0.1:8080/page.html -o page.html
        description: "`-s` (`--silent`) suppresses the progress bar, useful in scripts where you don't want that noise in logs."
        level: basic
      - title: "Show both a response and any error, quietly"
        code: curl -sS http://127.0.0.1:8080/page.html -o page.html
        description: "`-sS` keeps `-s`'s quiet progress but restores error messages `-s` alone would also hide. The combination you want in almost every script."
        level: intermediate
        tags: [scripting]
  - title: "Saving output"
    intro: "Choosing a filename, or letting curl pick one."
    examples:
      - title: "Save the response body to a named file"
        code: curl -o page.html http://127.0.0.1:8080/page.html
        description: "`-o` (`--output`) writes the body to the filename you give it, instead of stdout."
        level: basic
      - title: "Save using the remote file's own name"
        code: curl -O http://127.0.0.1:8080/robots.txt && cat robots.txt
        description: "`-O` (`--remote-name`) names the local file after the last path segment of the URL: here, `robots.txt`."
        output: |2
          User-agent: *
          Disallow: /site/b.html
        level: intermediate
      - title: "Resume an interrupted download"
        code: curl -C - -o robots.txt http://127.0.0.1:8080/robots.txt
        description: "`-C -` asks curl to figure out how much of the local file already exists and resume from there, if the server supports range requests. Avoids re-downloading a large file from scratch after a dropped connection."
        level: advanced
  - title: "Status codes and scripting"
    intro: "Making curl's exit code and output actually reflect success or failure."
    examples:
      - title: "Print only the HTTP status code"
        code: curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/page.html
        description: "Discard the body (`-o /dev/null`), silence the progress meter (`-s`), print just the status code (`-w`): the standard one-liner for a health check."
        output: |2
          200
        level: intermediate
        tags: [monitoring]
      - title: "Get a 404 for a page that doesn't exist"
        code: curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/missing.html
        description: "Without `--fail`, curl treats a 404 as a successfully completed transfer. It just happens to contain an error page."
        output: |2
          404
        level: intermediate
      - title: "Make curl itself fail on an HTTP error status"
        code: |-
          curl --fail -s http://127.0.0.1:8080/missing.html
          echo "exit=$?"
        description: "`--fail` (`-f`) turns a 4xx/5xx response into a non-zero exit code (`22`) instead of curl reporting success. This is the flag a script's error handling almost always needs."
        output: |2
          exit=22
        level: intermediate
        tags: [scripting]
      - title: "Print several facts about a transfer at once"
        code: curl -sS -w "time_total=%{time_total}s\n" -o /dev/null http://127.0.0.1:8080/page.html
        description: "`-w` accepts any combination of `%{...}` variables in one template string: status code, timing, sizes, effective URL, and more."
        volatile: "the timing is your connection's, not this one's"
        output: |
          time_total=0.230857s
        level: advanced
        tags: [performance, monitoring]
  - title: "Redirects"
    intro: "curl doesn't follow redirects unless you tell it to."
    examples:
      - title: "See a redirect without following it"
        code: curl -s http://127.0.0.1:8080/redirect/1 -o /dev/null -w "%{http_code}\n"
        description: "Without `-L`, curl reports the redirect's own status code (`302`) and doesn't request the new location."
        output: |2
          302
        level: intermediate
      - title: "Follow redirects to the final destination"
        code: curl -Ls http://127.0.0.1:8080/redirect/1 -o /dev/null -w "%{http_code} %{url_effective}\n"
        description: "`-L` (`--location`) follows the `Location` header automatically; `%{url_effective}` shows where curl actually ended up."
        output: |2
          200 http://127.0.0.1:8080/get
        level: intermediate
  - title: "Sending data: POST, PUT, DELETE"
    intro: "GET is implicit; a request body usually switches curl to POST automatically."
    examples:
      - title: "Send form data with POST"
        code: curl -X POST http://127.0.0.1:8080/post -d "name=deb1"
        description: "`-d` sends `application/x-www-form-urlencoded` data; `-X POST` is technically redundant here since `-d` already implies POST, but it's clearer to read."
        output: |2
          {
            "args": {},
            "data": "",
            "form": {
              "name": "deb1"
            },
            "headers": {
              "Accept": "*/*",
              "Content-Length": "9",
              "Content-Type": "application/x-www-form-urlencoded",
              "Host": "127.0.0.1:8080",
              "User-Agent": "curl/8.14.1"
            },
            "json": null,
            "url": "http://127.0.0.1:8080/post"
          }
        level: basic
        tags: [beginner]
      - title: "POST without spelling out -X"
        code: curl http://127.0.0.1:8080/post -d "name=deb1"
        description: "Confirms the point above: `-d` alone is enough to make curl send POST instead of GET."
        output: |2
          {
            "args": {},
            "data": "",
            "form": {
              "name": "deb1"
            },
            "headers": {
              "Accept": "*/*",
              "Content-Length": "9",
              "Content-Type": "application/x-www-form-urlencoded",
              "Host": "127.0.0.1:8080",
              "User-Agent": "curl/8.14.1"
            },
            "json": null,
            "url": "http://127.0.0.1:8080/post"
          }
        level: intermediate
      - title: "Send a JSON body"
        code: |-
          curl -X POST -H "Content-Type: application/json" -d '{"a":1}' http://127.0.0.1:8080/post
        description: "Set `Content-Type` yourself and pass raw JSON to `-d`. curl doesn't validate or reformat it, so make sure it's well-formed."
        output: |2
          {
            "args": {},
            "data": "{\"a\":1}",
            "form": {},
            "headers": {
              "Accept": "*/*",
              "Content-Length": "7",
              "Content-Type": "application/json",
              "Host": "127.0.0.1:8080",
              "User-Agent": "curl/8.14.1"
            },
            "json": {
              "a": 1
            },
            "url": "http://127.0.0.1:8080/post"
          }
        level: intermediate
      - title: "Send a query string alongside a GET request"
        code: curl -G --data-urlencode "q=hello world" http://127.0.0.1:8080/get
        description: "`-G` forces curl back to GET while still using `--data-urlencode` to build and properly escape the query string. Otherwise `-d`'s data would go in the request body instead of the URL."
        output: |2
          {
            "args": {
              "q": "hello world"
            },
            "headers": {
              "Accept": "*/*",
              "Host": "127.0.0.1:8080",
              "User-Agent": "curl/8.14.1"
            },
            "url": "http://127.0.0.1:8080/get?q=hello+world"
          }
        level: advanced
      - title: "Update a resource with PUT"
        code: curl -X PUT http://127.0.0.1:8080/put -d "status=updated"
        description: "Unlike POST, curl never infers PUT. `-X PUT` is required."
        output: |2
          {
            "args": {},
            "data": "",
            "form": {
              "status": "updated"
            },
            "headers": {
              "Accept": "*/*",
              "Content-Length": "14",
              "Content-Type": "application/x-www-form-urlencoded",
              "Host": "127.0.0.1:8080",
              "User-Agent": "curl/8.14.1"
            },
            "json": null,
            "url": "http://127.0.0.1:8080/put"
          }
        level: intermediate
      - title: "Remove a resource with DELETE"
        code: curl -X DELETE http://127.0.0.1:8080/delete
        description: "Same story as PUT: DELETE has to be spelled out with `-X`."
        level: intermediate
      - title: "Upload a file as multipart form data"
        code: curl -F "file=@robots.txt" http://127.0.0.1:8080/post
        description: "`-F` (`--form`) sends `multipart/form-data`, the format needed to upload a file. `-d` can't do this. The `@` prefix tells curl to read the named file's contents rather than sending the literal string."
        level: intermediate
        tags: [files]
  - title: "Headers and identity"
    intro: "Adding request headers, and reading back what the server received."
    examples:
      - title: "Add a custom request header"
        code: |-
          curl -H "X-Test: yes" http://127.0.0.1:8080/headers
        description: "`-H` adds one header per flag; repeat it for multiple headers."
        output: |2
          {
            "headers": {
              "Accept": "*/*",
              "Host": "127.0.0.1:8080",
              "User-Agent": "curl/8.14.1",
              "X-Test": "yes"
            }
          }
        level: intermediate
      - title: "Set a custom User-Agent"
        code: curl -A "MyScript/1.0" http://127.0.0.1:8080/user-agent
        description: "`-A` (`--user-agent`) is shorthand for `-H \"User-Agent: ...\"`. Some APIs reject requests with curl's default user agent, so this comes up more often than you'd expect."
        output: |2
          {
            "user-agent": "MyScript/1.0"
          }
        level: intermediate
  - title: "Authentication and cookies"
    intro: "Basic auth and session cookies."
    examples:
      - title: "Authenticate with HTTP Basic auth"
        code: curl -u user:pass http://127.0.0.1:8080/basic-auth/user/pass
        description: "`-u user:pass` sends the `Authorization: Basic ...` header curl builds from the credentials. Never hardcode real credentials in a script; read them from an environment variable or a credentials file instead."
        output: |2
          {
            "authenticated": true,
            "user": "user"
          }
        level: intermediate
        tags: [security]
      - title: "See what an unauthenticated request gets"
        code: curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/basic-auth/user/pass
        description: "Without `-u`, the same endpoint returns `401 Unauthorized`."
        output: |2
          401
        level: intermediate
      - title: "Save cookies from a response"
        code: curl -c cookies.txt http://127.0.0.1:8080/cookies/set/session/abc123 && cat cookies.txt
        description: "`-c` (`--cookie-jar`) writes any `Set-Cookie` headers to a file in Netscape cookie-file format."
        output: |2
          # Netscape HTTP Cookie File
          # https://curl.se/docs/http-cookies.html
          # This file was generated by libcurl! Edit at your own risk.

          127.0.0.1	FALSE	/	FALSE	0	session	abc123
        level: advanced
      - title: "Send cookies from a saved file"
        code: curl -b cookies.txt http://127.0.0.1:8080/cookies
        description: "`-b` (`--cookie`) reads a cookie jar and sends its cookies with the request. Pair with `-c` to persist a session across multiple curl calls, the way a browser would."
        output: |2
          {
            "cookies": {}
          }
        level: advanced
  - title: "Timeouts, retries, and TLS"
    intro: "Making curl behave well against a slow, flaky, or self-signed endpoint."
    examples:
      - title: "Give up after a fixed time"
        code: |-
          curl -m 2 http://127.0.0.1:8080/delay/5 -o /dev/null
          echo "exit=$?"
        description: "`-m` (`--max-time`) bounds the entire request; curl exits `28` on timeout. A script should treat that distinctly from a clean HTTP error."
        volatile: "the elapsed figure is however long your machine waited before the timeout fired"
        output: |2
          curl: (28) Operation timed out after 2007 milliseconds with 0 bytes received
          exit=28
        level: advanced
        tags: [scripting]
      - title: "Retry a failing request automatically"
        code: curl --retry 2 --retry-delay 1 -o /dev/null -s -w "%{http_code}\n" http://127.0.0.1:8080/status/500
        description: "`--retry` retries on transient failures and select 5xx responses, waiting `--retry-delay` seconds between attempts. Useful against flaky upstreams, not a substitute for `--fail` in the exit-code check."
        output: |2
          500
        level: advanced
        tags: [scripting]
      - title: "What an untrusted certificate looks like"
        code: |-
          curl -sS https://127.0.0.1:8443/page.html -o /dev/null
          echo "exit=$?"
        description: "Exit `60` is curl declining to trust the certificate, not the server refusing the request. The test server generates a self-signed certificate for `--tls`, which is exactly what a freshly configured internal service looks like."
        output: |2
          curl: (60) SSL certificate problem: self-signed certificate
          More details here: https://curl.se/docs/sslcerts.html

          curl failed to verify the legitimacy of the server and therefore could not
          establish a secure connection to it. To learn more about this situation and
          how to fix it, please visit the webpage mentioned above.
          exit=60
        level: advanced
        tags: [security]
      - title: "Skip TLS certificate verification"
        code: curl -sk https://127.0.0.1:8443/page.html -o /dev/null -w "%{http_code}\n"
        description: "`-k` (`--insecure`) turns that refusal off and the same request succeeds. Fine for a self-signed cert on a box you control during setup, never for anything handling real traffic or credentials - it disables the check that would tell you someone is in the middle."
        output: |2
          200
        level: advanced
        danger: true
        tags: [security]
      - title: "Watch the full TLS handshake and request"
        code: curl -kv https://127.0.0.1:8443/page.html -o /dev/null 2>&1 | grep -E "^[*>]" | head -22
        description: "`-v` (`--verbose`) prints the connection, the TLS handshake, the certificate the server presented and every header sent. The first thing to try when a request behaves unexpectedly. Lines starting `*` are curl's own commentary and `>` is what it sent."
        volatile: "the certificate dates are when the test server generated its key, and the cipher suite depends on your curl and OpenSSL versions"
        compare: shape
        output: |2
          * ALPN: curl offers h2,http/1.1
          * TLSv1.3 (OUT), TLS handshake, Client hello (1):
          * TLSv1.3 (IN), TLS handshake, Server hello (2):
          * TLSv1.3 (IN), TLS change cipher, Change cipher spec (1):
          * TLSv1.3 (IN), TLS handshake, Encrypted Extensions (8):
          * TLSv1.3 (IN), TLS handshake, Certificate (11):
          * TLSv1.3 (IN), TLS handshake, CERT verify (15):
          * TLSv1.3 (IN), TLS handshake, Finished (20):
          * TLSv1.3 (OUT), TLS change cipher, Change cipher spec (1):
          * TLSv1.3 (OUT), TLS handshake, Finished (20):
          * SSL connection using TLSv1.3 / TLS_AES_256_GCM_SHA384 / X25519MLKEM768 / RSASSA-PSS
          * ALPN: server did not agree on a protocol. Uses default.
          * Server certificate:
          *  subject: CN=localhost
          *  start date: Aug 17 11:25:46 2026 GMT
          *  expire date: Aug 17 11:25:46 2027 GMT
          *  issuer: CN=localhost
          *  SSL certificate verify result: self-signed certificate (18), continuing anyway.
          *   Certificate level 0: Public key type RSA (2048/112 Bits/secBits), signed using sha256WithRSAEncryption
          * Connected to 127.0.0.1 (127.0.0.1) port 8443
          * using HTTP/1.x
          > GET /page.html HTTP/1.1
        level: intermediate
        tags: [security]
      - title: "Check whether a site is up before proceeding"
        code: |-
          if curl --fail -s -o /dev/null http://127.0.0.1:8080/page.html; then
            echo "site is up"
          fi
        description: "`--fail` plus `-s -o /dev/null` reduces the whole request to a plain yes/no exit code, ready for an `if`."
        output: |2
          site is up
        level: intermediate
        tags: [scripting, monitoring]
      - title: "Extract one field from a JSON response"
        code: curl -s http://127.0.0.1:8080/get | python3 -c "import json,sys; print(json.load(sys.stdin)['url'])"
        description: "curl doesn't parse JSON itself. Pipe into `python3 -c`, or into [jq](/commands/jq/), which is built for exactly this but is not installed by default."
        output: |2
          http://127.0.0.1:8080/get
        level: advanced
        tags: [one-liners]
      - title: "See the public IP a request would come from"
        code: curl -s https://icanhazip.com
        description: "A quick way to confirm which outbound IP a script, container, or VPN is actually using. Hostnames/IPs shown here are sanitised."
        output: |
          203.0.113.42
        level: basic
        tags: [networking]
