command: tar
fixtures:
  - name: "site/"
    note: "the directory every example archives — `ls -lAR site`"
    from: "ls -lAR site"
    content: |
      site:
      total 12
      drwxr-xr-x 2 user user 4096 Jul  5 15:35 css
      drwxr-xr-x 2 user user 4096 Jul  5 15:35 img
      -rw-r--r-- 1 user user   14 Jul  5 15:35 index.html

      site/css:
      total 4
      -rw-r--r-- 1 user user 20 Jul  5 15:35 style.css

      site/img:
      total 20
      -rw-r--r-- 1 user user 20480 Jul  5 15:35 logo.png
  - name: "the working directory"
    note: "what sits alongside site/ — access.log for the compression comparison, two prebuilt archives, and empty restore targets"
    from: "ls -l"
    content: |
      total 224
      -rw-r--r-- 1 user user 162000 Jul  5 15:35 access.log
      drwxr-xr-x 2 user user   4096 Jul  5 15:35 backups
      -rw-r--r-- 1 user user  30720 Jul  5 15:35 plain.tar
      drwxr-xr-x 3 user user   4096 Jul  5 15:35 restore
      drwxr-xr-x 2 user user   4096 Jul  5 15:35 restore2
      drwxr-xr-x 4 user user   4096 Jul  5 15:35 site
      -rw-r--r-- 1 user user   9915 Jul  5 15:35 site-backup.tar.gz
      -rwxr-xr-x 1 user user     15 Jul  5 15:35 suid-file
sections:
  - title: "Creating archives"
    intro: "The -c mode, with a compression flag and a filename."
    examples:
      - title: "Create a gzip-compressed archive of a directory"
        code: "tar -czvf site-backup.tar.gz site/ | sort"
        description: >-
          `-c` create, `-z` gzip, `-v` verbose (print each file as it's added),
          `-f` the archive filename. This is the combination you'll type most.
        output: |2
          site/
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: basic
        tags: [beginner]
      - title: "Create an archive without compression"
        code: tar -cvf site-backup.tar site/
        description: "Drop `-z` for a plain, uncompressed `.tar`: faster to create, larger on disk. Useful as an intermediate step before compressing separately."
        level: basic
      - title: "Create an archive of specific files, not a whole directory"
        code: tar -czvf site-single.tar.gz site/index.html
        description: "Pass individual paths instead of a directory to archive just those files."
        output: |2
          site/index.html
        level: basic
      - title: "Create an archive whose paths don't include the parent directory"
        code: tar -czf site.tar.gz -C site .
        description: >-
          `-C site` changes into `site/` before archiving, so paths inside the
          archive start from `.` instead of `site/`. Useful when you want the
          archive's contents to land directly in whatever directory it's
          extracted into, with no wrapper folder.
        level: intermediate
      - title: "Exclude files matching a pattern"
        code: tar --exclude="*.png" --sort=name -czvf site-noimg.tar.gz site/
        description: "`--exclude` takes a glob and skips any matching path. Repeat the flag for multiple patterns."
        output: |2
          site/
          site/css/
          site/css/style.css
          site/img/
          site/index.html
        level: intermediate
      - title: "Exclude version control metadata"
        code: tar --exclude-vcs -czf snapshot.tar.gz site/
        description: "`--exclude-vcs` skips `.git`, `.svn`, and other VCS directories automatically, without listing them by hand."
        level: intermediate
      - title: "Exclude a list of patterns from a file"
        code: |-
          echo "*.png" > excludes.txt
          tar --exclude-from=excludes.txt --sort=name -czvf site-ex.tar.gz site/
        description: >-
          `--exclude-from` reads one glob per line from a file, easier to
          maintain than a long list of repeated `--exclude` flags once you have
          more than a couple of patterns.
        output: |2
          site/
          site/css/
          site/css/style.css
          site/img/
          site/index.html
        level: advanced
      - title: "Archive an explicit list of files from a text file"
        code: |-
          find site -name "*.css" > filelist.txt
          tar -czvf css-only.tar.gz --files-from=filelist.txt
        description: >-
          `--files-from` (`-T`) reads one path per line from a file instead of
          the command line, useful when the list of files to archive comes
          from `find`, a database query, or anywhere else that isn't a simple
          glob.
        output: |2
          site/css/style.css
        level: advanced
        tags: [scripting]
      - title: "Pipe find's output straight into tar"
        code: |-
          find site -name "*.html" -print0 | tar -czvf html-only.tar.gz --null --files-from=-
        description: >-
          `--null` pairs with `find -print0` so filenames containing spaces or
          newlines survive the trip intact instead of being split on
          whitespace. `--files-from=-` reads the (null-separated) list from
          stdin rather than a file.
        output: |2
          site/index.html
        level: advanced
        tags: [scripting]
      - title: "Back up only files changed in the last day"
        code: |-
          touch site/index.html
          find site -type f -mtime -1 -print0 | tar -czvf recent-changes.tar.gz --null --files-from=-
        description: >-
          Combines `find -mtime` with the same `--files-from=-` pattern to
          archive only recently modified files, a lightweight alternative to
          `-g`'s incremental snapshots for a cron job that just needs
          "today's changes."
        output: |2
          site/index.html
        level: advanced
        tags: [scripting, cron]
  - title: "Choosing a compression format"
    intro: "gzip, bzip2, and xz trade speed for ratio."
    examples:
      - title: "Compress with bzip2 instead of gzip"
        code: tar -cjvf site-backup.tar.bz2 site/
        description: "`-j` selects bzip2, slower than gzip but usually a bit smaller."
        level: intermediate
      - title: "Compress with xz for the smallest archive"
        code: tar -cJvf site-backup.tar.xz site/
        description: "`-J` selects xz, slowest to compress, but noticeably smaller output, especially on text-heavy content."
        level: intermediate
      - title: "Compare compressed sizes on the same content"
        code: |-
          tar -czf app.tar.gz access.log
          tar -cjf app.tar.bz2 access.log
          tar -cJf app.tar.xz access.log
          du -h --apparent-size app.tar.*
        description: >-
          On a large, repetitive text log, the difference is dramatic: xz and
          bzip2 both find redundancy gzip misses. On already-compressed content
          (images, video), expect all three to end up roughly the same size as
          the input.
        output: |2
          389	app.tar.bz2
          743	app.tar.gz
          308	app.tar.xz
        level: advanced
        tags: [performance]
      - title: "Let tar pick the compressor from the filename"
        code: "tar -acvf site-backup.tar.zst site/ | sort"
        description: >-
          `-a` (`--auto-compress`) reads the archive filename's extension and
          picks the matching compressor automatically, `zstd` for `.tar.zst`
          here, so you don't have to remember `-z`/`-j`/`-J` for less common
          formats. Requires the `zstd` package installed.
        output: |2
          site/
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: intermediate
      - title: "Let tar pick the decompressor from the filename on extract"
        code: |-
          tar --sort=name -acf site-backup.tar.zst site/
          tar -axvf site-backup.tar.zst -C restore/
        description: "`-a` works the same way on extraction: it inspects the `.tar.zst` extension and shells out to `zstd` without you naming the format explicitly."
        output: |2
          site/
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: intermediate
  - title: "Listing archive contents"
    intro: "Check what's inside before you extract it."
    examples:
      - title: "List an archive's contents"
        code: tar -tzvf site-backup.tar.gz
        description: "`-t` lists without extracting; `-v` here shows permissions, owner, size, and date, like `ls -l`."
        output: |2
          drwxr-xr-x user/user         0 2026-07-05 15:35 site/
          drwxr-xr-x user/user         0 2026-07-05 15:35 site/css/
          -rw-r--r-- user/user        20 2026-07-05 15:35 site/css/style.css
          drwxr-xr-x user/user         0 2026-07-05 15:35 site/img/
          -rw-r--r-- user/user     20480 2026-07-05 15:35 site/img/logo.png
          -rw-r--r-- user/user        14 2026-07-05 15:35 site/index.html
        level: basic
      - title: "List contents without the long format"
        code: tar -tf site-backup.tar.gz
        description: "Just the paths, one per line, good for piping into `grep` or `wc -l`."
        output: |2
          site/
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: basic
      - title: "Search an archive's contents for a pattern"
        code: tar --list --wildcards "*.html" -f site-backup.tar.gz
        description: "`--wildcards` filters the listing itself, without extracting anything first."
        output: |2
          site/index.html
        level: intermediate
  - title: "Extracting archives"
    intro: "The -x mode, and where things land."
    examples:
      - title: "Extract an archive into the current directory"
        code: "tar -xzvf site-backup.tar.gz | sort"
        description: "Recreates whatever directory structure was stored, relative to where you run the command."
        output: |2
          site/
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: basic
        tags: [beginner]
      - title: "Extract into a specific directory"
        code: tar -xzvf site-backup.tar.gz -C restore/
        description: "`-C` changes to the target directory first. The destination must already exist; `tar` won't create it."
        level: basic
      - title: "Extract just one file from an archive"
        code: tar -xzf site-backup.tar.gz -C restore/ site/index.html
        description: "Add the specific in-archive path after the archive name to extract only that file, keeping its stored directory structure."
        level: intermediate
      - title: "Extract without recreating the archive's top-level directory"
        code: "tar -xzvf site-backup.tar.gz --strip-components=1 -C restore/ | sort"
        description: >-
          `--strip-components=1` drops the first path segment of every entry
          during extraction, turning `site/index.html` into just `index.html`
          in the destination. Increase the number to drop more levels.
        output: |2
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: advanced
      - title: "Extract without overwriting files that already exist"
        code: "tar -xkvf plain.tar -C restore/ | sort"
        description: >-
          `-k` (`--keep-old-files`) refuses to overwrite existing files instead
          of silently replacing them, safer when restoring into a directory
          that might already have newer versions of some files.
        output: |2
          tar: site/css/style.css: Cannot open: File exists
          tar: site/img/logo.png: Cannot open: File exists
          tar: site/index.html: Cannot open: File exists
          tar: Exiting with failure status due to previous errors
          site/
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: advanced
      - title: "Extract only files matching a wildcard pattern"
        code: tar -xzvf site-backup.tar.gz --wildcards "*.css" -C restore/
        description: >-
          `--wildcards` filters at extraction time, the same way it filters a
          listing: only in-archive paths matching the glob get written to
          disk, everything else is skipped without needing a separate
          `--exclude`.
        output: |2
          site/css/style.css
        level: advanced
      - title: "Extract a single subdirectory, keeping its path"
        code: "tar -xzvf site-backup.tar.gz -C restore/ site/css | sort"
        description: >-
          Naming a directory instead of a single file extracts everything
          under it, keeping the stored path structure intact rather than
          flattening it into `restore/`.
        output: |2
          site/css/
          site/css/style.css
        level: intermediate
      - title: "Rename paths on the fly while extracting"
        code: "tar -xzvf site-backup.tar.gz --transform='s,^site,site-2025,' -C restore/ | sort"
        description: >-
          `--transform` runs a `sed`-style expression against every path as
          it's extracted, so `site/index.html` lands as `site-2025/index.html`
          on disk without repacking the archive first. `-v` still prints the
          original in-archive name, not the transformed one; check the
          destination directory to see the renamed result.
        output: |2
          site/
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: advanced
  - title: "Updating and appending"
    intro: "Adding to an archive that already exists."
    examples:
      - title: "Append a file to an existing uncompressed archive"
        code: tar -rvf plain.tar site/index.html
        description: >-
          `-r` (`--append`) adds files to the end of an existing `.tar`. This
          only works on uncompressed archives; you can't append to a `.tar.gz`
          directly.
        output: |2
          site/index.html
        level: intermediate
      - title: "Update only files that are newer than what's in the archive"
        code: tar -uvf plain.tar site/index.html
        description: >-
          `-u` (`--update`) is like `-r` but skips files whose in-archive
          copy is already up to date. No output here means nothing needed
          updating.
        level: advanced
      - title: "Update a whole directory tree, not just one file"
        code: |-
          tar -uvf plain.tar site/
          tar -tvf plain.tar
        description: >-
          `-u` against a directory checks every file under it, not just one
          path. The second listing shows the catch: `-u` appends newer
          versions to the end of the archive rather than rewriting it, so a
          changed file can appear twice, once stale, once current. Extracting
          uses the later (current) copy, but the archive keeps growing every
          time you update it; recreate it from scratch periodically instead
          of updating indefinitely.
        output: |2
          drwxr-xr-x user/user         0 2026-07-05 15:35 site/
          drwxr-xr-x user/user         0 2026-07-05 15:35 site/css/
          -rw-r--r-- user/user        20 2026-07-05 15:35 site/css/style.css
          drwxr-xr-x user/user         0 2026-07-05 15:35 site/img/
          -rw-r--r-- user/user     20480 2026-07-05 15:35 site/img/logo.png
          -rw-r--r-- user/user        14 2026-07-05 15:35 site/index.html
        level: advanced
        tags: [sysadmin]
  - title: "Verifying and troubleshooting"
    intro: "Trust, but check, before you delete the original."
    examples:
      - title: "Verify an archive is readable without extracting it"
        code: |-
          tar -tzf site-backup.tar.gz > /dev/null && echo "OK: archive is valid"
        description: >-
          Reads through the entire archive and checks the compressed stream and
          headers, without writing anything to disk. Cheap insurance before
          deleting whatever the archive backs up.
        output: |2
          OK: archive is valid
        level: intermediate
        tags: [sysadmin]
      - title: "Detect a corrupted or truncated archive"
        code: |-
          head -c 100 site-backup.tar.gz > corrupt.tar.gz
          tar -tzf corrupt.tar.gz; echo "exit=$?"
        description: >-
          A truncated file fails partway through with a clear error instead of
          silently reporting an empty archive. `tar` exits non-zero, which a
          backup script should check.
        output: |2
          gzip: stdin: unexpected end of file
          tar: Child returned status 1
          tar: Error is not recoverable: exiting now
          exit=2
        level: advanced
        tags: [sysadmin]
      - title: "See progress on a large archive without keeping the output"
        code: "tar -czvf /dev/null site/ | sort"
        description: >-
          Sending the archive itself to `/dev/null` while keeping `-v` gives
          you a pure progress listing, a quick way to sanity-check which files
          *would* be included before committing to a real destination.
        output: |2
          site/
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: advanced
      - title: "See the exact byte count written to an archive"
        code: tar -czf backup-totals.tar.gz --totals site/
        description: >-
          `--totals` prints a summary line after the archive is written,
          useful in a backup script's log without parsing `ls -lh` output
          separately. The throughput figure is specific to the machine it ran
          on and will differ every time.
        output: |2
          Total bytes written: 30720 (30KiB, 260MiB/s)
        level: intermediate
      - title: "Verify each file immediately after writing it"
        code: "tar -cWvf verify-write.tar site/ | sort"
        description: >-
          `-W` (`--verify`) re-reads every file straight back off disk after
          writing it and compares it to what's on disk, catching a write
          error at backup time instead of when you go to restore. It only
          works on uncompressed archives; drop `-z`/`-j`/`-J` or use the
          `tar -tzf` check above for a compressed one.
        output: |2
          Verify site/
          Verify site/css/
          Verify site/css/style.css
          Verify site/img/
          Verify site/img/logo.png
          Verify site/index.html
          site/
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: advanced
        tags: [sysadmin]
  - title: "Incremental and differential backups"
    intro: "-g turns a series of backups into a chain: one full backup, then only what changed."
    examples:
      - title: "Create a full (level 0) backup with a snapshot file"
        code: |-
          tar -czg site.snar --sort=name -f level0.tar.gz site/
          tar -tzf level0.tar.gz
        description: >-
          `-g site.snar` (`--listed-incremental`) writes a snapshot file
          alongside the archive recording every file's mtime and inode. The
          first run against a snapshot file that doesn't exist yet is always
          a full backup, identical in content to a plain `-c`.
        output: |2
          site/
          site/css/
          site/img/
          site/index.html
          site/css/style.css
          site/img/logo.png
        level: advanced
        tags: [sysadmin]
      - title: "Create an incremental backup containing only what changed"
        code: |-
          tar -czg site.snar --sort=name -f level0.tar.gz site/
          sleep 1
          echo "v2" > site/index.html
          echo "draft" > site/new.txt
          tar -czg site.snar --sort=name -f level1.tar.gz site/
          tar -tzvf level1.tar.gz
        description: >-
          Reusing the same `site.snar` snapshot file, `tar` compares the
          current tree against what it recorded last time and stores only the
          changed and new files. Every directory `tar` walks still shows up in
          the listing (each carries its own change-tracking record), but
          `site/css/style.css` and `site/img/logo.png` are absent: they're
          unchanged, so only `index.html` and the new `new.txt` were actually
          written.
        output: |2
          drwxr-xr-x user/user        32 2026-08-16 13:11 site/
          drwxr-xr-x user/user        12 2026-07-05 15:35 site/css/
          drwxr-xr-x user/user        11 2026-07-05 15:35 site/img/
          -rw-r--r-- user/user         3 2026-08-16 13:11 site/index.html
          -rw-r--r-- user/user         6 2026-08-16 13:11 site/new.txt
        level: advanced
        tags: [sysadmin]
      - title: "Restore a full backup plus its incremental layers in order"
        code: |-
          tar -czg site.snar --sort=name -f level0.tar.gz site/
          sleep 1
          echo "draft" > site/new.txt
          tar -czg site.snar --sort=name -f level1.tar.gz site/
          tar -xzf level0.tar.gz -C restore/
          tar -xzf level1.tar.gz -C restore/
          cat restore/site/new.txt
        description: >-
          Extraction order matters: the level 0 archive first, then each
          incremental layer on top, oldest to newest. Skipping a layer or
          extracting out of order leaves the restored tree in whatever state
          the layers you did apply produced, with no warning that anything's
          missing.
        output: |2
          draft
        level: advanced
        tags: [sysadmin]
      - title: "Apply file deletions recorded in an incremental backup"
        code: |-
          tar -czg site.snar --sort=name -f level0.tar.gz site/
          sleep 1
          echo "draft" > site/new.txt
          tar -czg site.snar --sort=name -f level1.tar.gz site/
          tar -xzf level0.tar.gz -C restore/
          tar -xzf level1.tar.gz -C restore/
          rm site/new.txt site/css/style.css
          tar -czg site.snar --sort=name -f level2.tar.gz site/
          tar --incremental -xzf level2.tar.gz -C restore/
          find restore/site -type f | sort
        description: >-
          A plain `-x` never deletes anything; it only adds or overwrites
          files. `--incremental` on extract replays the deletion records too,
          removing `new.txt` and `style.css` from `restore/` because they were
          gone when `level2.tar.gz` was created. Point `--incremental` at a
          restore directory that holds only files from this backup chain:
          it deletes anything not present in the layer being applied, which
          will silently remove unrelated files you'd added by hand.
        output: |2
          restore/site/img/logo.png
          restore/site/index.html
        level: advanced
        tags: [sysadmin]
        danger: true
  - title: "Preserving ownership and permissions"
    intro: "What tar keeps by default, and what it strips unless you ask for it."
    examples:
      - title: "List entries with numeric UID/GID instead of names"
        code: tar -tzvf site-backup.tar.gz --numeric-owner
        description: >-
          `--numeric-owner` shows the stored UID/GID instead of resolving them
          to names, useful when restoring on a machine where those numbers map
          to different accounts, or when the names in the archive don't exist
          locally at all.
        output: |2
          drwxr-xr-x 1000/1000         0 2026-07-05 15:35 site/
          drwxr-xr-x 1000/1000         0 2026-07-05 15:35 site/css/
          -rw-r--r-- 1000/1000        20 2026-07-05 15:35 site/css/style.css
          drwxr-xr-x 1000/1000         0 2026-07-05 15:35 site/img/
          -rw-r--r-- 1000/1000     20480 2026-07-05 15:35 site/img/logo.png
          -rw-r--r-- 1000/1000        14 2026-07-05 15:35 site/index.html
        level: intermediate
      - title: "Extraction strips the setuid bit by default"
        code: |-
          chmod 4755 suid-file
          tar -czf suid-test.tar.gz suid-file
          tar -xzf suid-test.tar.gz -C restore/
          ls -l restore/suid-file
        description: >-
          Without `-p`, a non-root extraction clears the setuid/setgid bits
          even if the archived file had them, GNU tar's safe default so
          restoring an archive can't hand out privileges nobody asked for.
        output: |2
          -rwxr-xr-x 1 user user 15 Jul  5 15:35 restore/suid-file
        level: advanced
        tags: [security]
      - title: "Restore permissions exactly, including setuid, with -p"
        code: |-
          chmod 4755 suid-file
          tar -czf suid-test.tar.gz suid-file
          tar -xzpf suid-test.tar.gz -C restore2/
          ls -l restore2/suid-file
        description: >-
          `-p` (`--preserve-permissions`) restores the archived mode exactly,
          setuid bit included. Only extract with `-p` from an archive you
          trust: applied to an untrusted archive, especially as root, it can
          silently recreate a setuid-root binary and hand anyone who can
          execute it a path to privilege escalation.
        output: |2
          -rwsr-xr-x 1 user user 15 Jul  5 15:35 restore2/suid-file
        level: advanced
        tags: [security]
        danger: true
  - title: "Comparing to the source directory"
    intro: "How much did compression actually buy you?"
    examples:
      - title: "Stream an archive to stdout instead of a file"
        code: tar --sort=name -czf - site/ | wc -c
        description: >-
          A single `-` as the filename means stdout (for `-c`) or stdin (for
          `-x`), the basis for streaming an archive straight over the network,
          e.g. `tar -czf - site/ | ssh deb1 'tar -xzf - -C /srv/backups'`,
          without ever writing the archive to disk on either end.
        output: |2
          9915
        level: advanced
        tags: [networking]
      - title: "Compare a directory's size to its compressed archive"
        code: |-
          du -sh site/
          tar -czf site-current.tar.gz site/
          du -h --apparent-size site-current.tar.gz
        description: >-
          `du -sh` sums the directory's real disk usage; compare it to the
          resulting archive size to judge whether the compression flag you
          chose is pulling its weight on this particular content.
        output: |2
          40K	site/
          9.7K	site-current.tar.gz
        level: intermediate
        tags: [disk]
  - title: "Streaming archives over ssh and stdin"
    intro: "The `-` filename from the previous section, put to work."
    examples:
      - title: "Send a directory to a remote host without a local archive file"
        code: tar -czf - site/ | ssh deb1 'tar -xzf - -C /srv/backups'
        description: >-
          The local `tar -c` writes to stdout, `ssh` carries those bytes to
          the remote shell's stdin, and the remote `tar -x` reads them
          straight off its own stdin. The compressed archive never touches
          disk on either end. See [ssh](/commands/ssh/) for setting up the
          key-based login this assumes.
        level: advanced
        tags: [ssh, networking]
      - title: "Pull a remote directory into a local archive over the same connection"
        code: ssh deb1 'tar -czf - -C /srv/www site' | tar -xzf - -C backups/
        description: >-
          The reverse direction: the remote `tar -c` writes to its stdout, ssh
          carries it back, and the local `tar -x` reads it from stdin. Handy
          for pulling a backup off a server without an intermediate file on
          either side.
        level: advanced
        tags: [ssh, networking]
      - title: "Extract an archive piped in from another command"
        code: cat site-backup.tar.gz | tar -xzvf - -C restore/
        description: >-
          Anything that writes a tar stream to stdout works in place of
          `cat`, most commonly `curl -fsSL https://example.com/release.tar.gz
          | tar -xzf - -C /opt/app` for installing a downloaded release
          without saving the tarball first.
        output: |2
          site/
          site/css/
          site/css/style.css
          site/img/
          site/img/logo.png
          site/index.html
        level: intermediate
        tags: [scripting]
  - title: "Handling sparse files"
    intro: "Files with large logical holes: disk images, preallocated databases."
    examples:
      - title: "See how little disk a sparse file actually uses"
        code: |-
          truncate -s 100M sparse.img
          dd if=/dev/urandom of=sparse.img bs=1 count=16 seek=50000000 conv=notrunc status=none
          du -h --apparent-size sparse.img
          du -h sparse.img
        description: >-
          `truncate` creates a 100M file that's almost entirely a hole; the
          16-byte `dd` write near the middle is the only real data in it.
          `--apparent-size` reports the logical size, plain `du` reports what's
          actually allocated on disk.
        output: |2
          100M	sparse.img
          4.0K	sparse.img
        level: intermediate
        tags: [disk]
      - title: "Archive it without and with sparse-file support"
        code: |-
          truncate -s 100M sparse.img
          dd if=/dev/urandom of=sparse.img bs=1 count=16 seek=50000000 conv=notrunc status=none
          tar -cf nosparse.tar sparse.img
          du -h --apparent-size nosparse.tar
          tar -cSf sparse.tar sparse.img
          du -h --apparent-size sparse.tar
        description: >-
          Without `-S` (`--sparse`), `tar` reads and stores every byte,
          holes included, so the archive balloons to the file's full logical
          size. `-S` detects the holes and stores only the real data plus
          their offsets. Skipping `-S` on a VM disk image or a preallocated
          database file can turn a 10K archive into a 100M one.
        output: |2
          101M	nosparse.tar
          10K	sparse.tar
        level: advanced
        tags: [disk]
  - title: "Symlinks: stored or followed"
    intro: "By default a symlink is archived as a link, not a copy of its target."
    examples:
      - title: "See how a symlink is stored by default"
        code: |-
          ln -s index.html site/latest.html
          tar --sort=name -czf link-test.tar.gz site/
          tar -tzvf link-test.tar.gz
        description: >-
          The listing shows `site/latest.html -> index.html` as a symlink
          entry, not a second copy of `index.html`'s content. Extracting it
          recreates the same symlink, which only resolves correctly if
          `index.html` is also present relative to it.
        output: |2
          drwxr-xr-x user/user         0 2026-08-16 13:11 site/
          drwxr-xr-x user/user         0 2026-07-05 15:35 site/css/
          -rw-r--r-- user/user        20 2026-07-05 15:35 site/css/style.css
          drwxr-xr-x user/user         0 2026-07-05 15:35 site/img/
          -rw-r--r-- user/user     20480 2026-07-05 15:35 site/img/logo.png
          -rw-r--r-- user/user        14 2026-07-05 15:35 site/index.html
          lrwxrwxrwx user/user         0 2026-08-16 13:11 site/latest.html -> index.html
        level: intermediate
        tags: [files]
      - title: "Follow symlinks and archive their targets instead"
        code: |-
          ln -s index.html site/latest.html
          tar --sort=name -czhf link-deref.tar.gz site/
          tar -tzvf link-deref.tar.gz
        description: >-
          `-h` (`--dereference`) archives the file a symlink points to rather
          than the link itself. Here it goes a step further: since
          `latest.html` and `index.html` point at the same underlying file,
          whichever one `tar` stores second gets recorded as a hardlink to the
          first instead of a duplicate copy, visible below as `site/index.html
          link to site/latest.html`.
        output: |2
          drwxr-xr-x user/user         0 2026-08-16 13:11 site/
          drwxr-xr-x user/user         0 2026-07-05 15:35 site/css/
          -rw-r--r-- user/user        20 2026-07-05 15:35 site/css/style.css
          drwxr-xr-x user/user         0 2026-07-05 15:35 site/img/
          -rw-r--r-- user/user     20480 2026-07-05 15:35 site/img/logo.png
          -rw-r--r-- user/user        14 2026-07-05 15:35 site/index.html
          hrw-r--r-- user/user         0 2026-07-05 15:35 site/latest.html link to site/index.html
        level: advanced
        tags: [files]
  - title: "Checking an archive against the current filesystem"
    intro: "Has anything changed since this backup was made?"
    examples:
      - title: "Confirm an archive still matches the files it came from"
        code: |-
          tar -cf plain-compare.tar site/
          tar -df plain-compare.tar; echo "exit=$?"
        description: >-
          `-d` (`--compare`/`--diff`) reads the archive and compares each
          entry's metadata and content against the file on disk right now,
          without extracting anything. No output plus exit `0` means
          everything still matches.
        output: |2
          exit=0
        level: intermediate
        tags: [sysadmin]
      - title: "Detect drift between an archive and the current filesystem"
        code: |-
          tar -cf plain-compare.tar site/
          echo "changed" > site/index.html
          tar -df plain-compare.tar; echo "exit=$?"
        description: >-
          Once a tracked file changes, `-d` lists exactly what's different
          about it and exits non-zero, useful for a periodic check that a
          "backed up" directory hasn't quietly drifted from its last backup.
        output: |2
          site/index.html: Mod time differs
          site/index.html: Size differs
          exit=1
        level: advanced
        tags: [sysadmin]
