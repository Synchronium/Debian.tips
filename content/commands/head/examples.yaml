sections:
  - title: "The basics: first and last N lines"
    intro: "Both default to 10 lines with no flags at all."
    examples:
      - title: "Show the first 10 lines of a file"
        code: head report.txt
        description: "No flags needed - 10 lines is the default for both head and tail."
        output: |
          line 1 of the report
          line 2 of the report
          line 3 of the report
          line 4 of the report
          line 5 of the report
          line 6 of the report
          line 7 of the report
          line 8 of the report
          line 9 of the report
          line 10 of the report
        level: basic
        tags: [beginner]
      - title: "Show the first 5 lines"
        code: head -n5 report.txt
        description: "`-n` takes the exact count."
        output: |
          line 1 of the report
          line 2 of the report
          line 3 of the report
          line 4 of the report
          line 5 of the report
        level: basic
        tags: [beginner]
      - title: "Same thing, older shorthand syntax"
        code: head -5 report.txt
        description: "A bare number after the dash, with no n, is an older but still-supported spelling of `-n5`."
        level: basic
      - title: "Show the last 10 lines of a file"
        code: tail report.txt
        description: "tail's default mirrors head's - the last 10 lines."
        output: |
          line 31 of the report
          line 32 of the report
          line 33 of the report
          line 34 of the report
          line 35 of the report
          line 36 of the report
          line 37 of the report
          line 38 of the report
          line 39 of the report
          line 40 of the report
        level: basic
        tags: [beginner]
      - title: "Show the last 5 lines"
        code: tail -n5 report.txt
        description: "Same `-n` flag as head, counting from the end instead."
        output: |
          line 36 of the report
          line 37 of the report
          line 38 of the report
          line 39 of the report
          line 40 of the report
        level: basic
        tags: [beginner]
      - title: "Read from stdin instead of a file"
        code: cat report.txt | head -n3
        description: "Both commands work the same on a pipe as on a named file."
        output: |
          line 1 of the report
          line 2 of the report
          line 3 of the report
        level: basic

  - title: "Working in bytes instead of lines"
    examples:
      - title: "Show the first N bytes"
        code: head -c 20 report.txt
        description: "`-c` switches from lines to raw bytes - cuts mid-line if the count lands there, with no regard for line boundaries at all."
        output: |
          line 1 of the report
        level: intermediate
      - title: "Show the last N bytes"
        code: tail -c 20 report.txt
        description: "Same byte-counting behaviour, from the end."
        output: |
          ne 40 of the report
        level: intermediate

  - title: "Multiple files and headers"
    examples:
      - title: "head on several files at once"
        code: head -n2 users.csv wordlist.txt
        description: "Each file gets a `==> filename <==` header before its output, with a blank line separating them."
        output: |
          ==> users.csv <==
          name,age,department
          Alice,34,Engineering

          ==> wordlist.txt <==
          banana
          apple
        level: intermediate
        tags: [beginner]
      - title: "tail on several files at once"
        code: tail -n2 users.csv wordlist.txt
        description: "Same header format as head, applied to each file's last lines instead of its first."
        output: |
          ==> users.csv <==
          Erin,38,Sales
          Frank,31,Engineering

          ==> wordlist.txt <==
          Elderberry
          cherry
        level: intermediate
      - title: "Suppress the headers with multiple files"
        code: head -n2 -q users.csv wordlist.txt
        description: "`-q` (`--quiet`) drops the `==> filename <==` headers entirely, even with several files given - useful when you just want the lines, not which file they came from."
        output: |
          name,age,department
          Alice,34,Engineering
          banana
          apple
        level: intermediate
      - title: "Force headers even for a single file"
        code: head -n2 -v report.txt
        description: "`-v` (`--verbose`) is the opposite of `-q`: always show the header, even with just one file - useful in a script that sometimes gets one filename and sometimes several, for consistent output either way."
        output: |
          ==> report.txt <==
          line 1 of the report
          line 2 of the report
        level: advanced

  - title: "Negative and plus offsets"
    intro: "Two GNU extensions that read almost like mirror images of each other."
    examples:
      - title: "Show everything except the last N lines"
        code: head -n -5 report.txt | tail -n3
        description: "A negative count with head means 'stop N lines before the end' instead of 'stop after N lines' - the last 3 lines shown here are lines 33-35, five lines short of the file's actual end at line 40."
        output: |
          line 33 of the report
          line 34 of the report
          line 35 of the report
        level: advanced
        tags: [beginner]
      - title: "Show everything from line N to the end"
        code: tail -n +38 report.txt
        description: "A + before the number with tail means 'start at line N' rather than 'show the last N lines' - the exact opposite framing from tail's usual behaviour."
        output: |
          line 38 of the report
          line 39 of the report
          line 40 of the report
        level: advanced
        tags: [beginner]
      - title: "Pull a specific slice out of the middle of a file"
        code: head -n15 report.txt | tail -n3
        description: "head down to line 15, then tail the last 3 of those - lines 13 through 15. A common lightweight alternative to `sed -n 'N,Mp'` for a quick one-off slice."
        output: |
          line 13 of the report
          line 14 of the report
          line 15 of the report
        level: intermediate
        tags: [beginner]
      - title: "The byte equivalents work the same way"
        code: printf 'abcdefghij' | head -c -3
        description: "All but the last 3 bytes."
        output: |
          abcdefg
        level: advanced
      - title: "Start from a specific byte instead of a specific line"
        code: printf 'abcdefghij' | tail -c +8
        description: "From byte 8 to the end - the same `+N` convention as `tail -n`, applied to bytes."
        output: |
          hij
        level: advanced
      - title: "tail -n +1 is equivalent to cat"
        code: printf 'a\nb\nc\n' | tail -n +1
        description: "Starting from line 1 means the whole file - not a practical use on its own, but useful to know when generating this flag programmatically and 1 turns out to be the starting value."
        output: |
          a
          b
          c
        level: intermediate
      - title: "Requesting zero lines is valid and returns nothing"
        code: head -n0 report.txt
        description: "No error, just empty output - worth knowing if a variable holding the line count could legitimately be 0 in a script."
        level: intermediate

  - title: "Following a growing file"
    intro: "tail's other job: watching a file as new lines are appended to it."
    examples:
      - title: "Follow a file in real time"
        code: tail -f livelog.txt
        description: >-
          Blocks and prints new lines as they're appended, instead of exiting once it reaches
          the current end of the file. Verified with a real background writer: two lines
          appended after `tail -f` started both appeared in its output within a second, live.
        output: |
          first new line
          second new line
        level: intermediate
        tags: [beginner]
      - title: "Follow only new lines, skipping existing content"
        code: tail -n0 -f watch.log
        description: "`-n0` starts from the current end of the file instead of printing the last 10 lines first - the shape you want when you only care about what happens from now on, not history."
        level: intermediate
        tags: [beginner]
      - title: "Filter a live-followed log for just the lines you care about"
        code: tail -n0 -f watch.log | grep --line-buffered ERROR
        description: >-
          `grep --line-buffered` is needed here - grep normally buffers its output in blocks when
          piped, which would delay matching lines from appearing until the buffer filled.
          Verified live: an INFO line and a later INFO line were both filtered out, only the
          ERROR line in between made it through, in real time.
        output: |
          ERROR: disk full
        level: advanced
        tags: [monitoring, beginner]
      - title: "Stop following once a specific process exits"
        code: tail -f --pid=1234 pidlog.txt
        description: >-
          `--pid` makes tail exit on its own once the given PID is no longer running, instead of
          following forever - useful for tailing a service's log only for the duration of a
          script that also manages that service. Verified: tail exited by itself immediately
          after the watched process was killed, and did not pick up a line appended after that.
        level: advanced

  - title: "Handling log rotation: -f vs -F"
    intro: "logrotate (and similar tools) renames the current log and starts a fresh file with the old name. Plain `-f` and capital `-F` react to that very differently."
    examples:
      - title: "Plain -f keeps watching the old file after rotation"
        code: tail -f rotlog.txt
        description: >-
          Verified: after rotlog.txt was renamed aside and a new file created with the same
          name, `tail -f` kept following the renamed (now-disconnected) file by its original
          inode - it printed the content from before the rotation, but never saw the new file's
          content at all, despite still technically running.
        danger: true
        output: |
          before rotation
        level: advanced
        tags: [beginner]
      - title: "-F notices the replacement and follows the new file"
        code: tail -F --sleep-interval=1 rotlog4.txt
        description: >-
          Verified: `-F` detected that rotlog4.txt had been replaced, printed an explicit notice
          to that effect, and picked up the new file's content - the correct choice for
          following anything that might be log-rotated out from under it.
        output: |
          before rotation
          tail: 'rotlog4.txt' has been replaced;  following new file
          after rotation
        level: advanced
        tags: [beginner, sysadmin]

  - title: "Practical patterns"
    examples:
      - title: "Sanity-check a CSV's structure without opening it"
        code: |
          head -n1 users.csv
          tail -n2 users.csv
        description: "Header row plus a couple of trailing rows is usually enough to confirm a data file has the shape you expect, without scrolling through the whole thing."
        output: |
          name,age,department
          Erin,38,Sales
          Frank,31,Engineering
        level: intermediate
        tags: [beginner]
      - title: "Preview a large file before committing to processing it"
        code: head -n20 access.log
        description: "Checking the shape of the first 20 lines before running a real awk/sed/grep pipeline over a file you haven't looked at yet catches format surprises early and cheaply."
        level: basic
        tags: [beginner]
