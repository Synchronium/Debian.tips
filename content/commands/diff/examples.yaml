command: diff
fixtures:
  - name: nginx-old.conf
    note: "the starting version - 10 lines"
    content: |
      server {
          listen 80;
          server_name example.com;
          root /var/www/html;
          index index.html;

          location / {
              try_files $uri $uri/ =404;
          }
      }
  - name: nginx-new.conf
    note: "the same file after adding IPv6, a second server_name, and an /api/ block"
    content: |
      server {
          listen 80;
          listen [::]:80;
          server_name example.com www.example.com;
          root /var/www/html;
          index index.html;

          location / {
              try_files $uri $uri/ =404;
          }

          location /api/ {
              proxy_pass http://127.0.0.1:8080;
          }
      }
  - name: "sp1.txt / sp2.txt"
    note: "differ only in the amount of whitespace, for -w"
    from: "tail -n +1 sp1.txt sp2.txt"
    content: |
      ==> sp1.txt <==
      a  b

      ==> sp2.txt <==
      a b
  - name: "ws1.txt / ws2.txt"
    note: "same words, different spacing throughout, for -b"
    from: "tail -n +1 ws1.txt ws2.txt"
    content: |
      ==> ws1.txt <==
      a b  c

      ==> ws2.txt <==
      a   b c
  - name: "c1.txt / c2.txt"
    note: "differ only in case, for -i"
    from: "tail -n +1 c1.txt c2.txt"
    content: |
      ==> c1.txt <==
      Hello

      ==> c2.txt <==
      hello
  - name: "bl1.txt / bl2.txt"
    note: "differ only by a blank line inserted after the first, for -B"
    from: "tail -n +1 bl1.txt bl2.txt"
    content: |
      ==> bl1.txt <==
      a
      b
      c

      ==> bl2.txt <==
      a

      b
      c
  - name: "crlf-a.txt / crlf-b.txt"
    note: "identical text, different line endings, for --strip-trailing-cr"
    from: 'tail -n +1 crlf-a.txt crlf-b.txt | sed "s/\r/␍/"'
    content: |
      ==> crlf-a.txt <==
      line1␍
      line2␍

      ==> crlf-b.txt <==
      line1
      line2
  - name: "confA/ and confB/"
    note: "two trees for the -r examples: common.conf is identical in both, nginx.conf is the old/new pair above, and each has one file the other lacks"
    from: "ls confA confB"
    content: |
      confA:
      common.conf
      nginx.conf
      onlyA.conf

      confB:
      common.conf
      nginx.conf
      onlyB.conf
sections:
  - title: "Basic comparison and exit codes"
    intro: "diff's exit code is as useful as its output - 0 for identical, 1 for different, 2 for an error."
    examples:
      - title: "Compare two files"
        code: diff nginx-old.conf nginx-new.conf
        description: >-
          The default format: `3c3,4` means line 3 of the first file changed into lines 3-4 of the
          second; `8a10,13` means after line 8, four lines were added. `<` marks the old side, `>` the
          new side.
        output: |
          3c3,4
          <     server_name example.com;
          ---
          >     listen [::]:80;
          >     server_name example.com www.example.com;
          8a10,13
          >     }
          >
          >     location /api/ {
          >         proxy_pass http://127.0.0.1:8080;
        level: basic
        tags: [beginner]
      - title: "Identical files produce no output and exit 0"
        code: diff nginx-old.conf nginx-old.conf
        description: "Comparing a file to itself (or to an identical copy) prints nothing - check the exit code, not the output, to know whether files matched."
        level: basic
        tags: [beginner]
      - title: "Just report whether files differ, not how"
        code: diff -q nginx-old.conf nginx-new.conf
        description: "`-q` (`--brief`) skips the line-by-line detail entirely - useful in a script that only needs a yes/no answer."
        output: |
          Files nginx-old.conf and nginx-new.conf differ
        level: basic
        tags: [beginner]
      - title: "Brief mode on identical files stays silent"
        code: diff -q nginx-old.conf nginx-old.conf
        description: "Same as full diff - no output at all when there's nothing to report, just exit 0."
        level: basic
      - title: "Comparing against a file that doesn't exist is an error, not a difference"
        code: diff nginx-old.conf missing.conf
        description: "Exit code 2, not 1 - diff distinguishes 'these differ' from 'I couldn't actually compare them.' Worth checking for in a script rather than assuming any non-zero exit means a content difference."
        output: |
          diff: missing.conf: No such file or directory
        level: intermediate
        tags: [beginner]
      - title: "Explicitly confirm two files are identical"
        code: diff -s nginx-old.conf nginx-old.conf
        description: "`-s` (`--report-identical-files`) is the mirror image of `-q`: prints a positive confirmation instead of staying silent, useful when silence-means-success would otherwise be ambiguous in a script's output."
        output: |
          Files nginx-old.conf and nginx-old.conf are identical
        level: intermediate

  - title: "Output formats"
    intro: "The default format is compact but hard to read. Three alternatives trade brevity for clarity."
    examples:
      - title: "Unified format - the one everyone actually uses"
        code: diff -u nginx-old.conf nginx-new.conf
        description: "A few lines of shared context (unmarked), then - for removed lines and + for added ones. This is also exactly what patch expects as input, and the format git diff itself is built on."
        volatile: "the timestamps in the `---` and `+++` header lines are when the sample files were created"
        output: |
          --- nginx-old.conf	2026-08-14 09:15:00.000000000 +0000
          +++ nginx-new.conf	2026-08-14 09:15:05.000000000 +0000
          @@ -1,10 +1,15 @@
           server {
               listen 80;
          -    server_name example.com;
          +    listen [::]:80;
          +    server_name example.com www.example.com;
               root /var/www/html;
               index index.html;

               location / {
                   try_files $uri $uri/ =404;
               }
          +
          +    location /api/ {
          +        proxy_pass http://127.0.0.1:8080;
          +    }
           }
        level: basic
        tags: [beginner]
      - title: "Control how many context lines unified format shows"
        code: diff -U1 nginx-old.conf nginx-new.conf
        description: "`-U` takes a number - fewer context lines than the default 3, for a tighter diff when you only care about the exact change, not its surroundings."
        volatile: "the timestamps in the `---` and `+++` header lines are when the sample files were created"
        output: |2
          --- nginx-old.conf	2026-08-15 10:09:33.149381006 +0000
          +++ nginx-new.conf	2026-08-15 10:09:33.149381006 +0000
          @@ -2,3 +2,4 @@
               listen 80;
          -    server_name example.com;
          +    listen [::]:80;
          +    server_name example.com www.example.com;
               root /var/www/html;
          @@ -9,2 +10,6 @@
               }
          +
          +    location /api/ {
          +        proxy_pass http://127.0.0.1:8080;
          +    }
           }
        level: intermediate
      - title: "Context format - the older alternative to unified"
        code: diff -c nginx-old.conf nginx-new.conf
        description: "Shows both versions of each changed block in full, marked with !, rather than interleaving - and + lines - more verbose than unified, mostly seen in older codebases and some BSD tooling."
        volatile: "the timestamps in the `***` and `---` header lines are when the sample files were created"
        output: |2
          *** nginx-old.conf	Sun Aug 16 09:29:21 2026
          --- nginx-new.conf	Sun Aug 16 09:29:21 2026
          ***************
          *** 1,10 ****
            server {
                listen 80;
          !     server_name example.com;
                root /var/www/html;
                index index.html;

                location / {
                    try_files $uri $uri/ =404;
                }
            }
          --- 1,15 ----
            server {
                listen 80;
          !     listen [::]:80;
          !     server_name example.com www.example.com;
                root /var/www/html;
                index index.html;

                location / {
                    try_files $uri $uri/ =404;
                }
          +
          +     location /api/ {
          +         proxy_pass http://127.0.0.1:8080;
          +     }
            }
        level: advanced
      - title: "Side-by-side comparison"
        code: diff -y --width=60 nginx-old.conf nginx-new.conf
        description: "`-y` puts both files in two columns with changed lines marked by `|` (changed), `<` (removed), or `>` (added) in the middle. `--width` caps the line length so it doesn't overflow a normal terminal."
        output: |2
          server {			server {
              listen 80;			    listen 80;
              server_name example.com; |	    listen [::]:80;
          			     >	    server_name example.com
              root /var/www/html;		    root /var/www/html;
              index index.html;		    index index.html;

              location / {		    location / {
                  try_files $uri $uri/	        try_files $uri $uri/
          			     >	    }
          			     >
          			     >	    location /api/ {
          			     >	        proxy_pass http://12
              }				    }
          }				}
        level: intermediate
      - title: "ed script format - output you could feed back into ed"
        code: diff -e nginx-old.conf nginx-new.conf
        description: "A niche format: valid input for the ed line editor to transform the old file into the new one. Rarely used directly today, but it's a reminder that diff predates every format built on top of it."
        output: |
          8a
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:8080;
          .
          3c
              listen [::]:80;
              server_name example.com www.example.com;
          .
        level: advanced

  - title: "Ignoring differences that don't matter"
    examples:
      - title: "See whitespace-only changes flagged as real differences"
        code: diff sp1.txt sp2.txt
        description: "'a  b' and 'a b' - two spaces versus one - count as a difference by default."
        output: |
          1c1
          < a  b
          ---
          > a b
        level: basic
      - title: "Ignore whitespace differences entirely"
        code: diff -w sp1.txt sp2.txt
        description: "`-w` (`--ignore-all-space`) treats any amount of whitespace as equivalent, including none at all - the strongest whitespace-ignoring option."
        level: intermediate
        tags: [beginner]
      - title: "Ignore changes in the amount of whitespace, but not its presence"
        code: diff -b ws1.txt ws2.txt
        description: "`-b` (`--ignore-space-change`) is gentler than `-w`: `a b  c` and `a   b c` are still both a-then-b-then-c with spaces between, even though the exact spacing differs."
        level: intermediate
      - title: "Ignore case differences"
        code: diff -i c1.txt c2.txt
        description: "`-i` treats `Hello` and `hello` as the same line - useful when comparing output that might differ only in casing conventions."
        level: intermediate
        tags: [beginner]
      - title: "See a blank-line-only change reported as a real difference"
        code: diff bl1.txt bl2.txt
        description: "bl2.txt differs from bl1.txt only by an inserted blank line, and by default that counts: 1a2 means a line was added after line 1."
        output: |
          1a2
          >
        level: advanced
      - title: "Ignore changes that only add or remove blank lines"
        code: diff -B bl1.txt bl2.txt
        description: "`-B` treats purely blank-line changes as no change at all, so this prints nothing and exits 0 - useful when reformatting shouldn't count as a content difference."
        level: advanced
      - title: "Ignore line-ending differences between Unix and Windows files"
        code: diff crlf-a.txt crlf-b.txt
        description: "Without any flag, a file with \\r\\n line endings looks completely different from the same content with plain \\n endings, even though every visible character matches - see the tr page for actually converting between them."
        output: |
          1,2c1,2
          < line1
          < line2
          ---
          > line1
          > line2
        level: intermediate
      - title: "The fix: strip trailing carriage returns before comparing"
        code: diff --strip-trailing-cr crlf-a.txt crlf-b.txt
        description: "Confirms the two files are actually identical in content once the CRLF-vs-LF line ending difference is discounted."
        level: advanced
        tags: [beginner]

  - title: "Comparing directories"
    examples:
      - title: "Recursively diff two directory trees"
        code: diff -r confA confB
        description: "Compares every file present in both directories, and separately reports any file that exists in only one of them."
        output: |
          diff -r confA/nginx.conf confB/nginx.conf
          3c3,4
          <     server_name example.com;
          ---
          >     listen [::]:80;
          >     server_name example.com www.example.com;
          8a10,13
          >     }
          >
          >     location /api/ {
          >         proxy_pass http://127.0.0.1:8080;
          Only in confA: onlyA.conf
          Only in confB: onlyB.conf
        level: intermediate
        tags: [beginner]
      - title: "Recursively diff, but only list which files differ"
        code: diff -rq confA confB
        description: "Combines `-r` with `-q` - a fast overview of an entire tree without the line-by-line detail for every changed file."
        output: |
          Files confA/nginx.conf and confB/nginx.conf differ
          Only in confA: onlyA.conf
          Only in confB: onlyB.conf
        level: intermediate
        tags: [beginner, sysadmin]
      - title: "A file missing from one side is normally an error, not a diff"
        code: diff confA/onlyA.conf confB/onlyA.conf
        description: "Same as the single-missing-file case earlier: exit 2, an error, because confB/onlyA.conf genuinely doesn't exist to compare against."
        output: |
          diff: confB/onlyA.conf: No such file or directory
        level: intermediate
      - title: "Treat a missing file as empty instead of erroring"
        code: diff -N confA/onlyA.conf confB/onlyA.conf
        description: "`-N` (`--new-file`) changes a missing file from an error into 'compare against nothing' - every line in the existing file shows as added or removed, depending on which side it's missing from."
        output: |
          1d0
          < only in A
        level: advanced

  - title: "Generating and applying a patch"
    intro: "`diff -u`'s output isn't just for reading - it's a format patch understands directly."
    examples:
      - title: "Save a unified diff to a patch file"
        code: diff -u nginx-old.conf nginx-new.conf > changes.patch
        description: "Redirecting `-u` output to a file produces exactly the .patch/.diff format used everywhere - email patches, git diff output, code review tools."
        level: intermediate
        tags: [beginner]
      - title: "Apply that patch to reproduce the change elsewhere"
        code: patch test-apply.conf < changes.patch
        description: "Given a copy of the original file and the patch, patch reconstructs the new version - this is literally how the patch was generated: `diff old new` produces the patch, and `patch old < patchfile` reconstructs new from it."
        output: |
          patching file test-apply.conf
        level: intermediate
      - title: "Confirm the patched file now matches the target exactly"
        code: diff test-apply.conf nginx-new.conf
        description: "No output, exit 0 - the patch applied cleanly and the result is byte-for-byte the intended new version."
        level: intermediate
        tags: [beginner]
